[package]
name = "hoist"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hoist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hoist-core = { version = "0.1.0", path = "../crates/core" }
tokio = { version = "1.54.1", features = ["full"] }
anyhow.workspace = true
thiserror.workspace = true
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v4"] }
image = "0.25"
base64 = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls", "native-tls"] }
keyring = "4"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

futures-util = "0.3.34"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "0.0.13"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-prevent-default = "6.0.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-devtools = "2.2.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
